name: collect-proxies

on:
  workflow_dispatch:
  schedule:
    # каждые 3 часа
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: proxy-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # Лимиты
      MAX_SERVERS_TOTAL: "600"
      MAX_SERVERS_PER_PROTOCOL: "250"
      MAX_WHITELIST: "300"
      MAX_RUSSIAN: "250"
      MAX_DUPLICATE_IP: "2"
      MAX_DUPLICATE_IP_WHITELIST: "3"

      # Квоты
      US_CA_QUOTA_PERCENT: "30"

      # Параметры проверки
      MAX_LATENCY_MS: "1500"
      TCP_TIMEOUT: "3.0"
      TCP_WORKERS: "50"
      GEO_WORKERS: "30"
      CORE_CHECK_WORKERS: "20"
      CORE_CHECK_TIMEOUT: "10"
      CORE_TEST_URL: "https://www.google.com/generate_204"

      # Включить/выключить проверки
      CHECK_TCP: "true"
      CHECK_CORES: "true"
      ENABLE_GITHUB_SEARCH: "true"
      ENABLE_GEO: "true"

      # Протоколы
      ALLOWED_PROTOCOLS: "vless,vmess,trojan,hysteria2,shadowsocks"
      COMMON_FILE_PROTOCOLS: "vless,vmess,trojan,hysteria2"
      BLOCKED_PROTOCOLS: "tuic,wireguard,socks,socks5,http,https"
      BLOCKED_NETWORKS: "quic"

      # Фильтры
      REQUIRE_ENCRYPTED: "true"
      ALLOW_PLAIN_VMESS: "false"
      ALLOW_UNKNOWN_COUNTRY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Xray
        run: |
          ARCH=$(uname -m)
          case $ARCH in
            x86_64) XRAY_ARCH="64";;
            aarch64) XRAY_ARCH="arm64-v8a";;
            *) XRAY_ARCH="64";;
          esac
          curl -sL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-${XRAY_ARCH}.zip" -o xray.zip || true
          if [ -f xray.zip ]; then
            unzip -q xray.zip -d xray-bin || true
            chmod +x xray-bin/xray || true
            echo "$(pwd)/xray-bin" >> $GITHUB_PATH
          fi

      - name: Install sing-box
        run: |
          ARCH=$(uname -m)
          case $ARCH in
            x86_64) SING_ARCH="amd64";;
            aarch64) SING_ARCH="arm64";;
            *) SING_ARCH="amd64";;
          esac
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          if [ -n "$VERSION" ]; then
            curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-${SING_ARCH}.tar.gz" -o singbox.tar.gz || true
            if [ -f singbox.tar.gz ]; then
              tar -xzf singbox.tar.gz --strip-components=1 --wildcards "*/sing-box" || true
              chmod +x sing-box || true
              echo "$(pwd)" >> $GITHUB_PATH
            fi
          fi

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collector.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists
          path: out/

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add out || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update proxy lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
