name: collect-proxies

on:
  workflow_dispatch:
  schedule:
    # каждые 1.5 часа (90 минут)
    - cron: "*/90 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      # Лимиты
      MAX_SERVERS_TOTAL: "600"
      MAX_SERVERS_PER_PROTOCOL: "250"
      MAX_WHITELIST: "300"
      MAX_RUSSIAN: "250"
      MAX_DUPLICATE_IP: "2"
      MAX_DUPLICATE_IP_WHITELIST: "3"
      
      # Квоты
      US_CA_QUOTA_PERCENT: "30"
      
      # Параметры проверки
      MAX_LATENCY_MS: "1500"
      CHECK_TCP: "true"
      CHECK_CORES: "true"
      CHECK_SPEED: "false"
      MIN_SPEED_MBPS: "5"
      
      # Workers
      TCP_WORKERS: "50"
      GEO_WORKERS: "30"
      CORE_CHECK_WORKERS: "20"
      
      # Протоколы
      ALLOWED_PROTOCOLS: "vless,vmess,trojan,hysteria2,shadowsocks"
      COMMON_FILE_PROTOCOLS: "vless,vmess,trojan,hysteria2"
      BLOCKED_PROTOCOLS: "tuic,wireguard,socks,socks5,http,https"
      
      # Фильтры
      REQUIRE_ENCRYPTED: "true"
      ALLOW_PLAIN_VMESS: "false"
      BLOCKED_NETWORKS: "quic"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests speedtest-cli

      - name: Install Xray
        run: |
          echo "[INFO] Downloading Xray..."
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip -q xray.zip -d xray-bin
          chmod +x xray-bin/xray
          echo "$(pwd)/xray-bin" >> $GITHUB_PATH
          echo "[OK] Xray installed"

      - name: Install sing-box
        run: |
          echo "[INFO] Downloading sing-box..."
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          VERSION=${VERSION#v}
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          find . -name "sing-box" -type f -exec chmod +x {} \;
          find . -name "sing-box" -type f -exec dirname {} \; | head -1 >> $GITHUB_PATH
          echo "[OK] sing-box installed"

      - name: Verify binaries
        run: |
          echo "[INFO] Checking binaries..."
          which xray || echo "[ERROR] xray not found"
          which sing-box || echo "[ERROR] sing-box not found"
          xray version || true
          sing-box version || true

      - name: Test collector
        run: |
          python test_collector.py

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collector.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists
          path: out/

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add out || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update proxy lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
