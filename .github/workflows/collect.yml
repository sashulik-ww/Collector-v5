name: collect-proxies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: proxy-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MAX_SERVERS_TOTAL: "600"
      MAX_SERVERS_PER_PROTOCOL: "250"
      MAX_WHITELIST: "300"
      MAX_RUSSIAN: "250"
      MAX_DUPLICATE_IP: "2"
      MAX_DUPLICATE_IP_WHITELIST: "3"
      US_CA_QUOTA_PERCENT: "30"

      MAX_LATENCY_MS: "1500"
      TCP_TIMEOUT: "2.5"
      TCP_WORKERS: "25"
      GEO_WORKERS: "15"
      TCP_MAX_CANDIDATES: "1500"

      CHECK_TCP: "true"
      CHECK_CORES: "false"
      ENABLE_GITHUB_SEARCH: "false"
      ENABLE_GEO: "true"
      ALLOW_UNKNOWN_COUNTRY: "true"

      ALLOWED_PROTOCOLS: "vless,vmess,trojan,hysteria2,shadowsocks"
      COMMON_FILE_PROTOCOLS: "vless,vmess,trojan,hysteria2"
      BLOCKED_PROTOCOLS: "tuic,wireguard,socks,socks5,http,https"
      BLOCKED_NETWORKS: "quic"

      REQUIRE_ENCRYPTED: "true"
      ALLOW_PLAIN_VMESS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u collector.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists
          path: out/

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add out || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update proxy lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
